<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xərc · Cost monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F3B45'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='%23E8A317' font-family='Arial'>₼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">₼</span>
      <div>
        <div class="brand-name">Xərc</div>
        <div class="brand-sub">Cost monitor</div>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#monitor" data-nav="monitor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        Monitoring
      </a>
      <a href="#edit" data-nav="edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        Edit data
      </a>
    </nav>
    <div class="rail-foot">
      <div class="bot-status"><span class="dot" id="bot-dot"></span><span id="bot-text">Bot offline</span></div>
      <button type="button" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div id="banner"></div>

    <!-- Monitoring -->
    <section id="page-monitor" aria-labelledby="monitor-title">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="monitor-title">Monitoring</h1>
          <p class="page-sub" id="range-label">&nbsp;</p>
        </div>
        <div class="head-actions">
          <div class="seg" id="period" role="group" aria-label="Period">
            <button type="button" data-p="7d">7 days</button>
            <button type="button" data-p="month">This month</button>
            <button type="button" data-p="lastmonth">Last month</button>
            <button type="button" data-p="90d">90 days</button>
            <button type="button" data-p="year">This year</button>
            <button type="button" data-p="all">All</button>
            <button type="button" data-p="custom">Custom</button>
          </div>
          <div class="custom-range" id="custom-range" hidden>
            <input type="date" id="c-start" aria-label="From">
            <input type="date" id="c-end" aria-label="To">
          </div>
          <button class="icon-btn" type="button" id="refresh" title="Reload from Google Sheets" aria-label="Reload data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </div>
      </div>
      <div id="monitor-body"><div class="loading"><div class="loader"></div>Loading data</div></div>
    </section>

    <!-- Edit data -->
    <section id="page-edit" aria-labelledby="edit-title" hidden>
      <div class="page-head">
        <div>
          <h1 class="page-title" id="edit-title">Edit data</h1>
          <p class="page-sub">Add income, correct costs, manage categories and currencies.</p>
        </div>
        <div class="head-actions">
          <button class="btn btn-income" type="button" data-add="income">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add income
          </button>
          <button class="btn btn-expense" type="button" data-add="expense">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add cost
          </button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="tx">Transactions<span class="count" id="count-tx">0</span></button>
        <button type="button" role="tab" data-tab="cats">Categories<span class="count" id="count-cats">0</span></button>
        <button type="button" role="tab" data-tab="rates">Currencies<span class="count" id="count-rates">0</span></button>
      </div>
      <div id="edit-body"></div>
    </section>
  </main>
</div>

<nav class="bottomnav" aria-label="Main">
  <a href="#monitor" data-nav="monitor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Monitoring
  </a>
  <a href="#edit" data-nav="edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Edit data
  </a>
</nav>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
